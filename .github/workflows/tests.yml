name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
      - run: uv sync --locked --all-extras --dev
      - run: uv run --no-sync pytest -q
        env:
          MPLBACKEND: Agg
      - run: uv build
