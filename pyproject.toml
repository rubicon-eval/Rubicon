[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rubicon-benchmark"
version = "0.1.0"
description = "RUBICON: evaluating recognition of irreversible failure in visual planning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0,<4", "matplotlib>=3.10,<4", "numpy>=2.2,<3", "tqdm>=4.66,<5",
  "openai>=1.60,<3", "python-dotenv>=1.0,<2", "diskcache>=5.6,<6",
  "huggingface-hub>=0.34,<2",
]

[project.optional-dependencies]
google = ["google-genai>=1.0,<3", "redis>=5,<8"]
analysis = ["adjustText>=1.3,<2"]
editor = ["gradio>=6.9,<7"]
data = ["datasets>=4,<5", "pyarrow>=19", "Pillow>=11"]

[project.urls]
Homepage = "https://rubicon-eval.github.io/"
Repository = "https://github.com/rubicon-eval/Rubicon"
Dataset = "https://huggingface.co/datasets/ajirs/rubicon"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["puzzles*", "scripts*", "verify*"]

[tool.setuptools.package-data]
scripts = ["data/*.json"]
verify = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
